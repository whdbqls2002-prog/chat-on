<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CHaT ON</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f7fb; --panel:#fff; --text:#20212a; --muted:#777985;
  --line:#ececf2; --brand:#6d4aff; --soft:#f0ecff;
}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:780px;margin:auto;min-height:100vh;background:var(--panel)}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:5}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}
.logo span{font-weight:400}
.top-actions{display:flex;gap:8px}
.icon-btn,.primary{border:0;border-radius:12px;padding:10px 13px;font-weight:800}
.icon-btn{background:#f2f2f6;color:var(--text)}
.primary{background:var(--brand);color:white}
main{padding:18px 15px 90px}
.hero{background:linear-gradient(135deg,#eeeaff,#f7f4ff 60%,#edf6ff);padding:30px 22px;border-radius:24px;margin-bottom:26px}
.hero small{color:var(--brand);font-weight:900;font-size:11px}
.hero h1{font-size:34px;line-height:1.12;letter-spacing:-2px;margin:9px 0 11px}
.hero p{margin:0;color:#666874;line-height:1.55;font-size:14px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 13px}
.section-head h2{font-size:21px;margin:0;letter-spacing:-.7px}
.section-head button{border:0;background:transparent;color:var(--brand);font-weight:800}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid #e5e5eb;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:13px}
.tab.active{background:#20212a;color:#fff;border-color:#20212a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:19px;background:white;padding:10px;text-align:left;box-shadow:0 3px 12px rgba(30,30,50,.04)}
.card:active{transform:scale(.985)}
.avatar{height:145px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:54px;background:#efedfc}
.card h3{margin:10px 3px 4px;font-size:16px}
.card p{font-size:12px;color:var(--muted);line-height:1.45;margin:0 3px;min-height:35px}
.tag{display:inline-block;font-size:10px;background:#f4f4f7;color:#696a75;border-radius:7px;padding:5px 7px;margin:8px 3px 2px}
.empty{display:none;text-align:center;color:#999;padding:30px 0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}
.bottom button{flex:1;border:0;background:transparent;padding:7px;color:#83848e;font-size:11px}
.bottom button b{display:block;font-size:20px;margin-bottom:3px}
.bottom button.active{color:var(--brand)}
.full{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}
.full.show{display:flex}
.page-head{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.page-head strong{flex:1}
.close{width:38px;height:38px;border:0;border-radius:11px;background:#f2f2f5;font-size:21px}
.messages{flex:1;overflow:auto;background:#fafafd;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-top-right-radius:5px}
.composer{display:flex;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.composer input{flex:1;min-width:0;border:1px solid #dedee5;border-radius:13px;padding:11px 12px;outline:0}
.send{border:0;background:var(--brand);color:#fff;border-radius:13px;padding:0 15px;font-weight:800}
.form-wrap{padding:18px;overflow:auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid #dedee5;border-radius:13px;padding:12px;background:white;outline:0}
.field textarea{min-height:92px;resize:vertical}
.save{width:100%;border:0;background:var(--brand);color:#fff;border-radius:14px;padding:14px;font-weight:900;margin-top:4px}
.note{font-size:12px;color:#888a95;line-height:1.5}
.list{padding:14px;overflow:auto}
.saved-chat{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}
.saved-chat b{display:block;margin-bottom:4px}
.saved-chat span{font-size:12px;color:#888}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.avatar{height:160px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">CHaT <span>ON</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="historyBtn">대화</button>
      <button class="primary" id="makeBtn">+ 만들기</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <small>AI CHARACTER CHAT</small>
      <h1>원하는 캐릭터와<br>이야기를 시작하세요.</h1>
      <p>캐릭터를 고르고 대화하거나, 나만의 캐릭터를 직접 만들어보세요.</p>
    </section>

    <div class="section-head"><h2>추천 캐릭터</h2></div>
    <div class="tabs">
      <button class="tab active" data-filter="all">전체</button>
      <button class="tab" data-filter="romance">로맨스</button>
      <button class="tab" data-filter="daily">일상</button>
      <button class="tab" data-filter="fantasy">판타지</button>
      <button class="tab" data-filter="custom">내 캐릭터</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">아직 캐릭터가 없어요.</div>
  </main>

  <nav class="bottom">
    <button class="active"><b>⌂</b>홈</button>
    <button id="bottomHistory"><b>💬</b>대화</button>
    <button id="bottomMake"><b>＋</b>만들기</button>
  </nav>
</div>

<div class="full" id="chatPage">
  <div class="page-head">
    <div id="chatEmoji" style="font-size:24px">🌙</div>
    <strong id="chatName">서연</strong>
    <button class="close" id="closeChat">×</button>
  </div>
  <div class="messages" id="messages"></div>
  <form class="composer" id="composer">
    <input id="msgInput" autocomplete="off" placeholder="메시지를 입력하세요">
    <button class="send">전송</button>
  </form>
</div>

<div class="full" id="makePage">
  <div class="page-head">
    <strong>캐릭터 만들기</strong>
    <button class="close" id="closeMake">×</button>
  </div>
  <div class="form-wrap">
    <div class="field"><label>이름</label><input id="cName" placeholder="예: 지우"></div>
    <div class="field"><label>이모지</label><input id="cEmoji" placeholder="예: 🐰" maxlength="4"></div>
    <div class="field"><label>장르</label>
      <select id="cType"><option value="romance">로맨스</option><option value="daily">일상</option><option value="fantasy">판타지</option></select>
    </div>
    <div class="field"><label>한 줄 소개</label><input id="cDesc" placeholder="예: 장난기 많은 같은 과 동기"></div>
    <div class="field"><label>성격 / 말투</label><textarea id="cPersona" placeholder="예: 무심한 척하지만 은근 다정함. 반말 사용."></textarea></div>
    <div class="field"><label>첫 대사</label><textarea id="cFirst" placeholder="예: 이제 왔어? 기다렸잖아."></textarea></div>
    <button class="save" id="saveCharacter">캐릭터 저장</button>
    <p class="note">지금 단계에서는 캐릭터와 대화 기록을 이 기기 브라우저에 저장해요. 진짜 AI 연결은 다음 단계에서 붙일 수 있어요.</p>
  </div>
</div>

<div class="full" id="historyPage">
  <div class="page-head">
    <strong>대화 기록</strong>
    <button class="close" id="closeHistory">×</button>
  </div>
  <div class="list" id="historyList"></div>
</div>

<script>
const baseCharacters=[
 {id:"seoyeon",name:"서연",emoji:"🌙",type:"romance",desc:"무심한 척하지만 은근히 당신을 신경 쓰는 같은 과 동기.",persona:"츤데레 대학생. 반말. 짧고 현실적으로 대답함.",first:"왔네. 무슨 일인데 갑자기 나한테 말 걸었어?"},
 {id:"harin",name:"하린",emoji:"🌸",type:"daily",desc:"밝고 장난기 많은 오래된 친구.",persona:"밝고 장난기 많음. ㅋㅋ를 자연스럽게 사용.",first:"오 ㅋㅋ 드디어 왔네. 오늘 뭐했어?"},
 {id:"luna",name:"루나",emoji:"✨",type:"fantasy",desc:"마법 세계에서 만난 신비로운 마법사.",persona:"차분하고 신비로운 판타지 말투.",first:"어서 와, 여행자여. 널 기다리고 있었어."}
];
let current=null;

const $=id=>document.getElementById(id);
const getCustom=()=>JSON.parse(localStorage.getItem("chaton_custom")||"[]");
const getChats=()=>JSON.parse(localStorage.getItem("chaton_chats")||"{}");
const saveChats=v=>localStorage.setItem("chaton_chats",JSON.stringify(v));

function allCharacters(){return [...baseCharacters,...getCustom()]}
function renderCards(filter="all"){
 const grid=$("grid"); grid.innerHTML="";
 const items=allCharacters().filter(c=>filter==="all"||(filter==="custom"?c.custom:c.type===filter));
 items.forEach(c=>{
   const b=document.createElement("button");
   b.className="card";
   b.innerHTML=`<div class="avatar">${c.emoji||"🙂"}</div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.desc||"설명이 없습니다.")}</p><span class="tag">#${c.custom?"내캐릭터":typeLabel(c.type)}</span>`;
   b.onclick=()=>openChat(c);
   grid.appendChild(b);
 });
 $("empty").style.display=items.length?"none":"block";
}
function typeLabel(t){return t==="romance"?"로맨스":t==="fantasy"?"판타지":"일상"}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 t.classList.add("active"); renderCards(t.dataset.filter);
});

function openChat(c){
 current=c; $("chatName").textContent=c.name; $("chatEmoji").textContent=c.emoji||"🙂";
 $("messages").innerHTML="";
 const chats=getChats(); const saved=chats[c.id]||[];
 if(saved.length){saved.forEach(m=>addMessage(m.text,m.who,false))}
 else addMessage(c.first||"안녕!", "ai", false);
 $("chatPage").classList.add("show");
 document.body.style.overflow="hidden";
}
function addMessage(text,who,save=true){
 const d=document.createElement("div"); d.className="msg "+who; d.textContent=text;
 $("messages").appendChild(d); $("messages").scrollTop=$("messages").scrollHeight;
 if(save&&current){
   const chats=getChats(); chats[current.id]=chats[current.id]||[];
   chats[current.id].push({who,text,time:Date.now()}); saveChats(chats);
 }
}
function closePage(id){$(id).classList.remove("show");document.body.style.overflow=""}

$("composer").onsubmit=e=>{
 e.preventDefault(); const text=$("msgInput").value.trim(); if(!text||!current)return;
 addMessage(text,"me"); $("msgInput").value="";
 setTimeout(()=>addMessage(makeDemoReply(current,text),"ai"),450);
};
function makeDemoReply(c,text){
 const p=(c.persona||"").toLowerCase();
 if(c.name==="서연") return ["그래? 계속 말해봐. 듣고 있으니까.","뭐야 ㅋㅋ 갑자기 왜 그래.","흠… 그건 좀 궁금한데?"][Math.floor(Math.random()*3)];
 if(c.name==="하린") return ["ㅋㅋㅋ 진짜? 그래서 어떻게 됐는데?","오 그거 재밌는데? 더 말해봐.","좋아 ㅋㅋ 그럼 다음엔 뭐할까?"][Math.floor(Math.random()*3)];
 if(c.name==="루나") return ["흥미로운 이야기군. 계속 들려줘.","그 선택이 운명을 바꿀 수도 있겠군.","좋아. 그럼 다음 장면으로 가보자."][Math.floor(Math.random()*3)];
 return [`${c.name}: ${text}라고? 좀 더 말해줘.`, "응, 듣고 있어. 계속 말해봐.", "그건 흥미롭네. 넌 어떻게 생각해?"][Math.floor(Math.random()*3)];
}

$("closeChat").onclick=()=>closePage("chatPage");
$("closeMake").onclick=()=>closePage("makePage");
$("closeHistory").onclick=()=>closePage("historyPage");
function showMake(){ $("makePage").classList.add("show"); document.body.style.overflow="hidden" }
$("makeBtn").onclick=showMake; $("bottomMake").onclick=showMake;

$("saveCharacter").onclick=()=>{
 const name=$("cName").value.trim(); if(!name){alert("이름을 입력해줘.");return}
 const c={
  id:"custom_"+Date.now(), custom:true, name,
  emoji:$("cEmoji").value.trim()||"🙂", type:$("cType").value,
  desc:$("cDesc").value.trim()||"내가 만든 캐릭터",
  persona:$("cPersona").value.trim(),
  first:$("cFirst").value.trim()||`안녕, 나는 ${name}이야.`
 };
 const arr=getCustom(); arr.push(c); localStorage.setItem("chaton_custom",JSON.stringify(arr));
 ["cName","cEmoji","cDesc","cPersona","cFirst"].forEach(id=>$(id).value="");
 renderCards("all"); closePage("makePage"); alert("캐릭터를 만들었어!");
};

function showHistory(){
 const list=$("historyList"); list.innerHTML="";
 const chats=getChats(); const chars=allCharacters();
 let count=0;
 Object.keys(chats).forEach(id=>{
   const c=chars.find(x=>x.id===id); if(!c||!chats[id].length)return;
   count++;
   const last=chats[id][chats[id].length-1];
   const d=document.createElement("button");
   d.className="saved-chat"; d.style.width="100%"; d.style.textAlign="left"; d.style.background="#fff";
   d.innerHTML=`<b>${c.emoji||"🙂"} ${escapeHtml(c.name)}</b><span>${escapeHtml(last.text.slice(0,45))}</span>`;
   d.onclick=()=>{closePage("historyPage");openChat(c)};
   list.appendChild(d);
 });
 if(!count) list.innerHTML='<p style="text-align:center;color:#999;padding:30px">아직 저장된 대화가 없어요.</p>';
 $("historyPage").classList.add("show"); document.body.style.overflow="hidden";
}
$("historyBtn").onclick=showHistory; $("bottomHistory").onclick=showHistory;

renderCards();
</script>
</body>
</html>
